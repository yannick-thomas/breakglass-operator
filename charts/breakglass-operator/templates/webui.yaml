{{- if .Values.webui.enabled -}}
{{- $name := include "breakglass.fullname" . -}}
{{- if and .Values.webui.ingress.enabled (ne (get (urlParse .Values.webui.publicURL) "host") .Values.webui.ingress.host) -}}
{{- fail "webui.ingress.host must match the HTTPS origin in webui.publicURL" -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-webui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-webui-reader
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
rules:
  - apiGroups: [access.breakglass.io]
    resources: [accessprofiles, breakglassrequests, breakglassapprovals, breakglasssessions]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-webui-reader
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}-webui-reader}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}-webui, namespace: {{ .Release.Namespace }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-webui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  # The BFF's login sessions are in memory. Do not run multiple replicas.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: breakglass-operator
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: breakglass-operator
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: webui
    spec:
      serviceAccountName: {{ $name }}-webui
      securityContext:
        {{- include "breakglass.podSecurity" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: webui
          image: {{ include "breakglass.image" .Values.webui.image | quote }}
          imagePullPolicy: {{ .Values.webui.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          securityContext:
            {{- include "breakglass.containerSecurity" . | nindent 12 }}
          env:
            - {name: WEBUI_PORT, value: "8080"}
            - {name: WEBUI_IN_CLUSTER, value: "true"}
            - {name: WEBUI_OIDC_ENABLED, value: "true"}
            - {name: WEBUI_COOKIE_SECURE, value: "true"}
            - name: WEBUI_PUBLIC_URL
              value: {{ .Values.webui.publicURL | quote }}
            - name: WEBUI_OIDC_ISSUER_URL
              value: {{ .Values.webui.oidc.issuerURL | quote }}
            - name: WEBUI_OIDC_CLIENT_ID
              value: {{ .Values.webui.oidc.clientID | quote }}
            - name: WEBUI_OIDC_REDIRECT_URL
              value: {{ printf "%s/auth/callback" .Values.webui.publicURL | quote }}
            {{- with .Values.webui.oidc.existingSecret }}
            - name: WEBUI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.webui.oidc.clientSecretKey }}
            {{- end }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.webui.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-webui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: breakglass-operator
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: webui
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
{{- if .Values.webui.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-webui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
  {{- with .Values.webui.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.webui.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.webui.ingress.host | quote }}]
      secretName: {{ .Values.webui.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.webui.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-webui
                port: {name: http}
{{- end }}
{{- end }}
