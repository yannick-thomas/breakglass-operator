{{- $name := include "breakglass.fullname" . -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-manager-role
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: {{ .Values.curatedClusterRoles | toJson }}
    verbs: [bind, get]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: {{ .Values.allowedTargetNamespaces | toJson }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-manager-rolebinding
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}-manager-role}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}-controller-manager, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}-leader-election-role}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}-controller-manager, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-metrics-auth-role
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-metrics-auth-rolebinding
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}-metrics-auth-role}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}-controller-manager, namespace: {{ .Release.Namespace }}}
{{- range .Values.allowedTargetNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-manager-rolebindings
  namespace: {{ . }}
  labels:
    {{- include "breakglass.labels" $ | nindent 4 }}
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create, delete, get, list, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-manager-rolebindings
  namespace: {{ . }}
  labels:
    {{- include "breakglass.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}-manager-rolebindings}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}-controller-manager, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- range .Values.controlNamespaces }}
---
# Access objects are read and written only in the control namespaces (ADR-004).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-manager-access
  namespace: {{ . }}
  labels:
    {{- include "breakglass.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [access.breakglass.io]
    resources: [accessprofiles, breakglassapprovals, breakglassrequests]
    verbs: [get, list, watch]
  - apiGroups: [access.breakglass.io]
    resources: [accessprofiles/status, breakglassrequests/status, breakglasssessions/status]
    verbs: [get, patch, update]
  - apiGroups: [access.breakglass.io]
    resources: [breakglasssessions]
    verbs: [create, get, list, patch, update, watch]
  - apiGroups: [access.breakglass.io]
    resources: [breakglasssessions/finalizers]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-manager-access
  namespace: {{ . }}
  labels:
    {{- include "breakglass.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}-manager-access}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}-controller-manager, namespace: {{ $.Release.Namespace }}}
{{- end }}
