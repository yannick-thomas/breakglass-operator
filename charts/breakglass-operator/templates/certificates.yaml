{{- $name := include "breakglass.fullname" . -}}
{{- if not .Values.certManager.issuerRef }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
{{- end }}
{{- /* certificate name, Service it serves, Secret name */ -}}
{{- $certs := list
  (list "serving-cert" "webhook-service" "webhook-server-cert")
  (list "metrics-cert" "controller-manager-metrics-service" "metrics-server-cert")
  (list "admission-metrics-cert" "admission-metrics-service" "admission-metrics-server-cert") }}
{{- range $cert := $certs }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-{{ index $cert 0 }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "breakglass.labels" $ | nindent 4 }}
spec:
  dnsNames:
    - {{ $name }}-{{ index $cert 1 }}.{{ $.Release.Namespace }}.svc
    - {{ $name }}-{{ index $cert 1 }}.{{ $.Release.Namespace }}.svc.cluster.local
  secretName: {{ $name }}-{{ index $cert 2 }}
  issuerRef:
    {{- if $.Values.certManager.issuerRef }}
    {{- toYaml $.Values.certManager.issuerRef | nindent 4 }}
    {{- else }}
    kind: Issuer
    name: {{ $name }}-selfsigned-issuer
    {{- end }}
---
{{- end }}
