{{- $name := include "breakglass.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-webhook-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "breakglass.managerSelector" . | nindent 4 }}
  ports:
    - {name: https, port: 443, targetPort: webhook-server, protocol: TCP}
{{- range $mode := list "mutate" "validate" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: {{ if eq $mode "mutate" }}Mutating{{ else }}Validating{{ end }}WebhookConfiguration
metadata:
  name: {{ $name }}-{{ if eq $mode "mutate" }}mutating{{ else }}validating{{ end }}-webhook-configuration
  labels:
    {{- include "breakglass.labels" $ | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s-serving-cert" $.Release.Namespace $name | quote }}
webhooks:
  {{- range $resource := list "breakglassapproval" "breakglassrequest" "breakglasssession" }}
  - name: {{ if eq $mode "mutate" }}m{{ else }}v{{ end }}{{ $resource }}-v1alpha1.kb.io
    admissionReviewVersions: [v1]
    clientConfig:
      service:
        name: {{ $name }}-webhook-service
        namespace: {{ $.Release.Namespace }}
        path: /{{ $mode }}-access-breakglass-io-v1alpha1-{{ $resource }}
        port: 443
    failurePolicy: Fail
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 5
    rules:
      - apiGroups: [access.breakglass.io]
        apiVersions: [v1alpha1]
        operations:
          - CREATE
          {{- if eq $mode "validate" }}
          - UPDATE
          {{- if eq $resource "breakglassapproval" }}
          - DELETE
          {{- end }}
          {{- end }}
        resources: [{{ $resource }}s]
        # Access objects are namespaced (ADR-004). A Cluster scope here would
        # silently exempt every one of them from admission.
        scope: Namespaced
  {{- end }}
{{- end }}
