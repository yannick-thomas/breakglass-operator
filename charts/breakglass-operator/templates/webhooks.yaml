{{- $name := include "breakglass.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-webhook-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
spec:
  # Only the admission pods serve webhooks (ADR-005).
  selector:
    {{- include "breakglass.admissionSelector" . | nindent 4 }}
  ports:
    - {name: https, port: 443, targetPort: webhook-server, protocol: TCP}
{{- range $mode := list "mutate" "validate" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: {{ if eq $mode "mutate" }}Mutating{{ else }}Validating{{ end }}WebhookConfiguration
metadata:
  name: {{ $name }}-{{ if eq $mode "mutate" }}mutating{{ else }}validating{{ end }}-webhook-configuration
  labels:
    {{- include "breakglass.labels" $ | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s-serving-cert" $.Release.Namespace $name | quote }}
webhooks:
  {{- /* AccessProfile is validated on creation only: its spec is immutable,
  so placement is decided once (ADR-004). Order matches config/webhook. */}}
  {{- $resources := list "breakglassapproval" "breakglassrequest" "breakglasssession" }}
  {{- if eq $mode "validate" }}
  {{- $resources = prepend $resources "accessprofile" }}
  {{- end }}
  {{- range $resource := $resources }}
  - name: {{ if eq $mode "mutate" }}m{{ else }}v{{ end }}{{ $resource }}-v1alpha1.kb.io
    admissionReviewVersions: [v1]
    clientConfig:
      service:
        name: {{ $name }}-webhook-service
        namespace: {{ $.Release.Namespace }}
        path: /{{ $mode }}-access-breakglass-io-v1alpha1-{{ $resource }}
        port: 443
    failurePolicy: Fail
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 5
    rules:
      - apiGroups: [access.breakglass.io]
        apiVersions: [v1alpha1]
        operations:
          - CREATE
          {{- if and (eq $mode "validate") (ne $resource "accessprofile") }}
          - UPDATE
          {{- if eq $resource "breakglassapproval" }}
          - DELETE
          {{- end }}
          {{- end }}
        resources: [{{ $resource }}s]
        # Access objects are namespaced (ADR-004). A Cluster scope here would
        # silently exempt every one of them from admission.
        scope: Namespaced
  {{- end }}
  {{- if eq $mode "validate" }}
  # Drain check for control namespaces (ADR-004): a control namespace may be
  # deleted only after its sessions are gone, because the manager's rights on
  # them are the Roles in that namespace. It fails closed, so the selector
  # limits it to exactly the control namespaces; no other namespace deletion
  # depends on admission.
  - name: vcontrolnamespace-v1.kb.io
    admissionReviewVersions: [v1]
    clientConfig:
      service:
        name: {{ $name }}-webhook-service
        namespace: {{ $.Release.Namespace }}
        path: /validate-core-v1-namespace
        port: 443
    failurePolicy: Fail
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 5
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            {{- range $.Values.controlNamespaces }}
            - {{ . | quote }}
            {{- end }}
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [DELETE]
        resources: [namespaces]
        scope: Cluster
  {{- end }}
{{- end }}
