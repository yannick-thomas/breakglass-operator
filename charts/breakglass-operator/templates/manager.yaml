{{- $name := include "breakglass.fullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "breakglass.managerSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "breakglass.managerSelector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}-controller-manager
      securityContext:
        {{- include "breakglass.podSecurity" . | nindent 8 }}
      terminationGracePeriodSeconds: 10
      {{- include "breakglass.podScheduling" (dict "root" . "selector" (include "breakglass.managerSelector" .)) | nindent 6 }}
      containers:
        - name: manager
          image: {{ include "breakglass.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/manager]
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --metrics-secure=true
            - --metrics-cert-path=/tmp/k8s-metrics-server/serving-certs
            {{- include "breakglass.placementArgs" . | nindent 12 }}
          ports:
            - {name: health, containerPort: 8081, protocol: TCP}
            - {name: https, containerPort: 8443, protocol: TCP}
          securityContext:
            {{- include "breakglass.containerSecurity" . | nindent 12 }}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: metrics-certs
              mountPath: /tmp/k8s-metrics-server/serving-certs
              readOnly: true
      volumes:
        - name: metrics-certs
          secret:
            secretName: {{ $name }}-metrics-server-cert
{{- if .Values.availability.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "breakglass.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.availability.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "breakglass.managerSelector" . | nindent 6 }}
{{- end }}
