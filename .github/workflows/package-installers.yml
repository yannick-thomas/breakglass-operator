name: Package Installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  package:
    name: Publish image and rendered installers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/breakglass-operator
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Enable amd64 and arm64 image builds
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the manager image
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}

      - name: Render immutable installers
        run: |
          make build-installers IMG="${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}"
          printf '%s\n' \
            '# BreakGlass Operator installer bundle' \
            '' \
            "Manager image: ${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}" \
            '' \
            'Choose exactly one profile:' \
            '- `install.yaml`: default secure installation.' \
            '- `install-production.yaml`: high-availability cluster-wide production installation.' \
            '- `install-production-namespaced.yaml`: high-assurance production installation restricted to the `production` target namespace.' \
            '' \
            'Install with, for example:' \
            '`kubectl apply -f install-production-namespaced.yaml`' \
            > dist/README.md

      - name: Upload installer bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breakglass-operator-install-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
