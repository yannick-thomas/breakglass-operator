name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Promote the previously gated image and publish installer assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/breakglass-operator
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a tag commit already merged to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists" >&2
            exit 1
          fi
      - name: Resolve the image built by the gated main CI
        id: image
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
          case "${digest}" in
            sha256:*) echo "digest=${digest}" >> "${GITHUB_OUTPUT}" ;;
            *) echo "Could not resolve a manifest-list digest for the gated source image" >&2; exit 1 ;;
          esac
      - name: Promote the exact multi-architecture manifest list
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_REPOSITORY}:${GITHUB_REF_NAME}" \
            "${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}"
      - name: Render digest-pinned installers
        run: |
          make build-installers IMG="${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}"
          sha256sum dist/install*.yaml > dist/SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/install*.yaml dist/SHA256SUMS --generate-notes --title "BreakGlass Operator ${GITHUB_REF_NAME}"
