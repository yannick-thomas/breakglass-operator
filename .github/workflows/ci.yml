name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A newer commit or pull-request update makes any older run obsolete. Cancelling
# it before Kind and multi-architecture work begins saves the largest runner
# cost without weakening the checks performed for the newest revision.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Verify Go module metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify module metadata without modifying the checkout
        run: make verify-dependencies

  lint:
    name: Lint
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

  webui-frontend:
    name: WebUI frontend
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: internal/webui/frontend
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/webui/frontend/package-lock.json
      # No dependency needs an install script; keep them disabled.
      - name: Install dependencies from the lockfile
        run: npm ci --ignore-scripts --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm run test:e2e

  test:
    name: Unit and integration tests
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run tests
        run: make test

  security:
    name: Trivy source and manifest scan
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Keep the policy explicit here so changes are visible in code review.
      # Required CI and branch protection must protect main from any change
      # that weakens this gate.
      - name: Scan source, Kubernetes manifests, and tracked secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Source charts require an explicit image; this allows Trivy to
          # render it instead of silently omitting its Kubernetes resources.
          TRIVY_HELM_SET: image.tag=ci-scan
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: "true"
          timeout: 10m

  verify-manifests:
    name: Render and verify installation profiles
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Render and verify manifests
        run: make verify-manifests

  test-e2e:
    name: E2E on Kind
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Kind
        uses: ./.github/actions/setup-kind
      - name: Run E2E tests
        run: make test-e2e
      - name: Upload default Kind compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: default-kind-compatibility-evidence-${{ github.sha }}
          path: e2e-artifacts/default
          if-no-files-found: error
          retention-days: 14

  verify-helm:
    name: Helm chart security and packaging
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: ./.github/actions/setup-helm
      - name: Verify chart security and CRD synchronization
        run: make verify-helm
      - name: Verify immutable chart packaging
        run: |
          make package-helm \
            IMG="ghcr.io/${{ github.repository_owner }}/breakglass-operator@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            WEBUI_IMG="ghcr.io/${{ github.repository_owner }}/breakglass-webui@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb" \
            SOURCE_REVISION="${GITHUB_SHA}"
          helm lint dist/breakglass-operator-0.1.0.tgz --strict

  test-e2e-helm:
    name: Helm install and upgrade on Kind workers
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: ./.github/actions/setup-helm
      - uses: ./.github/actions/setup-kind
      - name: Run the production lifecycle through Helm
        run: make test-e2e-helm
      - name: Upload Helm lifecycle evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helm-kind-evidence-${{ github.sha }}
          path: e2e-artifacts/helm
          if-no-files-found: error
          retention-days: 14

  test-e2e-production:
    name: Production E2E on Kind workers
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Kind
        uses: ./.github/actions/setup-kind
      - name: Run production E2E tests
        run: make test-e2e-production
      - name: Upload production Kind compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-kind-compatibility-evidence-${{ github.sha }}
          path: e2e-artifacts/production
          if-no-files-found: error
          retention-days: 14

  package:
    name: Publish gated operator, WebUI and installer bundle
    needs: [lint, test, webui-frontend, security, verify-manifests, verify-helm, test-e2e, test-e2e-production, test-e2e-helm]
    # Publishing is deliberately a post-gate action. Pull requests never get a
    # registry token or a Buildx cache write; manual runs are restricted to
    # main as well.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/breakglass-operator
      WEBUI_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/breakglass-webui
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the manager image
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=breakglass-operator-main
          cache-to: type=gha,mode=max,scope=breakglass-operator-main
      # The image is addressed by its immutable digest, not its mutable tag.
      # Installer artifacts are produced only after this policy gate succeeds.
      - name: Scan the published manager image (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.image.outputs.digest }}
          scanners: vuln,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: "true"
          timeout: 10m
      - name: Scan the published manager image (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.image.outputs.digest }}
          scanners: vuln,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: "true"
          timeout: 10m
      - name: Build and publish the WebUI image
        id: webui-image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.webui
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.WEBUI_IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=breakglass-webui-main
          cache-to: type=gha,mode=max,scope=breakglass-webui-main
      - name: Scan the published WebUI image (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.WEBUI_IMAGE_REPOSITORY }}@${{ steps.webui-image.outputs.digest }}
          scanners: vuln,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: "true"
          timeout: 10m
      - name: Scan the published WebUI image (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.WEBUI_IMAGE_REPOSITORY }}@${{ steps.webui-image.outputs.digest }}
          scanners: vuln,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: "true"
          timeout: 10m
      - name: Render immutable installers
        run: |
          make build-installers IMG="${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}"
          printf '%s\n' \
            '# BreakGlass Operator installer bundle' \
            '' \
            "Manager image: ${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}" \
            '' \
            'Choose exactly one profile:' \
            '- `install.yaml`: default secure installation.' \
            '- `install-production.yaml`: high-availability cluster-wide production installation.' \
            '- `install-production-namespaced.yaml`: high-assurance production installation restricted to the `production` target namespace.' \
            '' \
            'Prerequisites:' \
            '- cert-manager must already be installed and ready; this bundle intentionally does not install a cluster-wide cert-manager dependency.' \
            '- The namespaced profile deliberately does not create the application namespace. Before using it, create or verify the approved `production` target namespace.' \
            '- The namespaced profile also requires the control namespace `breakglass-access`. Create it before applying access profiles: profiles, requests, approvals and sessions live there, and requester and approver roles are bound there with RoleBindings.' \
            '- The manager and the expiry guard run with `--allowed-target-namespaces=production` and `--control-namespaces=breakglass-access`. Control namespaces must not overlap target namespaces and are required whenever target namespaces are explicit; the manager refuses to start otherwise.' \
            '' \
            'Preflight commands:' \
            '`kubectl get crd certificates.cert-manager.io`' \
            '`kubectl get namespace production`' \
            '`kubectl get namespace breakglass-access`' \
            '' \
            'Install with, for example:' \
            '`kubectl apply -f install-production-namespaced.yaml`' \
            > dist/README.md
      - uses: ./.github/actions/setup-helm
      - name: Package a chart with the gated image digest
        run: |
          make package-helm IMG="${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}" \
            WEBUI_IMG="${WEBUI_IMAGE_REPOSITORY}@${{ steps.webui-image.outputs.digest }}" \
            CHART_VERSION="0.1.0-dev.${GITHUB_SHA:0:12}" CHART_APP_VERSION="sha-${GITHUB_SHA}" SOURCE_REVISION="${GITHUB_SHA}"
          (cd dist && sha256sum install*.yaml breakglass-operator-*.tgz release.json > SHA256SUMS)
      - name: Upload installer bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breakglass-operator-install-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
