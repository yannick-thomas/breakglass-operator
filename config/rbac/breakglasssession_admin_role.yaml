# This rule is not used by the project breakglass-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over access.breakglass.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: breakglass-operator
    app.kubernetes.io/managed-by: kustomize
  name: breakglasssession-admin-role
rules:
- apiGroups:
  - access.breakglass.io
  resources:
  - breakglasssessions
  verbs:
  - '*'
- apiGroups:
  - access.breakglass.io
  resources:
  - breakglasssessions/status
  verbs:
  - get
