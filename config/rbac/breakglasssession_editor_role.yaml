# This rule is not used by the project breakglass-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the access.breakglass.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: breakglass-operator
    app.kubernetes.io/managed-by: kustomize
  name: breakglasssession-editor-role
rules:
- apiGroups:
  - access.breakglass.io
  resources:
  - breakglasssessions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - access.breakglass.io
  resources:
  - breakglasssessions/status
  verbs:
  - get
