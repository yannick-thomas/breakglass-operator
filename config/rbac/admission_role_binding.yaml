# Binds the generated admission-role (config/rbac/admission_role.yaml, from
# the markers in internal/webhook) to the admission ServiceAccount only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: breakglass-operator
    app.kubernetes.io/component: admission
    app.kubernetes.io/managed-by: kustomize
  name: admission-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admission-role
subjects:
- kind: ServiceAccount
  name: admission
  namespace: system
