# The expiry guard has its own identity so that its RoleBinding deletions are
# distinguishable from the manager's in the Kubernetes audit log.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: breakglass-operator
    app.kubernetes.io/component: expiry-guard
    app.kubernetes.io/managed-by: kustomize
  name: expiry-guard
  namespace: system
