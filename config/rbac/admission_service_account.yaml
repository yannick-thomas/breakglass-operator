# The admission server (ADR-005) runs under its own identity. It may read
# access objects, read Namespaces and create SubjectAccessReviews; it can
# neither bind roles nor write RoleBindings, sessions or status.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: breakglass-operator
    app.kubernetes.io/component: admission
    app.kubernetes.io/managed-by: kustomize
  name: admission
  namespace: system
