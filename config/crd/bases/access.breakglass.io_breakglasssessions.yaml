---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: breakglasssessions.access.breakglass.io
spec:
  group: access.breakglass.io
  names:
    kind: BreakGlassSession
    listKind: BreakGlassSessionList
    plural: breakglasssessions
    shortNames:
    - bgs
    singular: breakglasssession
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Authenticated requester granted access
      jsonPath: .spec.subject.name
      name: Subject
      type: string
    - description: Administrator-owned access profile
      jsonPath: .spec.accessProfile
      name: Profile
      type: string
    - description: Resolved curated role
      jsonPath: .status.grant.roleRef.name
      name: Role
      type: string
    - description: Resolved fixed target namespace
      jsonPath: .status.grant.targetNamespace
      name: Target-NS
      type: string
    - description: Session phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Session expiry timestamp
      jsonPath: .status.expiresAt
      name: Expires-At
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BreakGlassSession is the Schema for the breakglasssessions API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of BreakGlassSession
            properties:
              accessProfile:
                description: |-
                  AccessProfile is the fixed, administrator-owned access policy to use.
                  The requester requires the custom RBAC verb "use" on this named profile.
                maxLength: 253
                minLength: 1
                type: string
              accessProfileUID:
                description: |-
                  AccessProfileUID is written by the mutating admission webhook from the
                  selected profile's server-assigned UID. It prevents a delete/recreate of
                  the same profile name from silently changing a pending request.
                minLength: 1
                type: string
              duration:
                description: Duration is the lifespan of this break-glass session
                  (e.g. "30m", "1h", "2h30m").
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                type: string
              reason:
                description: Reason explains why this emergency access is needed (audit
                  trail).
                maxLength: 1024
                minLength: 5
                type: string
              revoked:
                description: Revoked allows manual revocation before the duration
                  expires.
                type: boolean
              subject:
                description: |-
                  Subject is written by the mutating admission webhook from the
                  authenticated API requester. Client-supplied values are overwritten and
                  v1alpha1 supports only a self-service User grant.
                properties:
                  kind:
                    description: Kind of the subject (User, Group, ServiceAccount)
                    enum:
                    - User
                    - Group
                    - ServiceAccount
                    type: string
                  name:
                    description: Name of the subject (e.g. email, username, serviceaccount
                      name)
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the subject (only relevant when Kind
                      is ServiceAccount)
                    maxLength: 63
                    type: string
                required:
                - kind
                - name
                type: object
            required:
            - accessProfile
            - accessProfileUID
            - duration
            - reason
            - subject
            type: object
            x-kubernetes-validations:
            - message: accessProfile is immutable
              rule: self.accessProfile == oldSelf.accessProfile
            - message: accessProfileUID is immutable
              rule: self.accessProfileUID == oldSelf.accessProfileUID
            - message: subject is immutable
              rule: self.subject == oldSelf.subject
            - message: duration is immutable
              rule: self.duration == oldSelf.duration
            - message: reason is immutable
              rule: self.reason == oldSelf.reason
            - message: revoked cannot be changed from true to false
              rule: '!has(oldSelf.revoked) || !oldSelf.revoked || (has(self.revoked)
                && self.revoked)'
            - message: v1alpha1 self-service sessions may only grant the authenticated
                User requester
              rule: self.subject.kind == 'User' && (!has(self.subject.namespace) ||
                size(self.subject.namespace) == 0)
          status:
            description: status defines the observed state of BreakGlassSession
            properties:
              bindingName:
                description: BindingName is the name of the created RoleBinding.
                type: string
              bindingRef:
                description: |-
                  BindingRef is the authoritative identity of the RBAC binding created for
                  this session. Once present, the controller only acts on an object that
                  matches this kind, namespace, name, and UID exactly.
                properties:
                  kind:
                    description: |-
                      Kind is RoleBinding. ClusterRoleBinding is deliberately not supported by
                      the AccessProfile-based v1alpha1 API.
                    enum:
                    - RoleBinding
                    type: string
                  name:
                    description: Name is the RBAC binding name.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace is the fixed namespace of the profile's
                      RoleBinding.
                    minLength: 1
                    type: string
                  uid:
                    description: UID is the server-assigned UID of the created binding.
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                - namespace
                - uid
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the session's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                description: ExpiresAt is the calculated expiration time
                format: date-time
                type: string
              grant:
                description: |-
                  Grant is the immutable profile snapshot resolved when the session became
                  active. A missing or mismatched profile snapshot is fail-closed.
                properties:
                  accessProfile:
                    description: AccessProfile is the selected policy name.
                    type: string
                  accessProfileUID:
                    description: AccessProfileUID is the UID of the policy that was
                      authorized and resolved.
                    type: string
                  roleRef:
                    description: RoleRef is the profile's curated ClusterRole.
                    properties:
                      kind:
                        default: ClusterRole
                        description: Kind of the role (ClusterRole or Role)
                        enum:
                        - Role
                        - ClusterRole
                        type: string
                      name:
                        description: Name of the Role or ClusterRole
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                  roleRulesHash:
                    description: |-
                      RoleRulesHash is a canonical SHA-256 digest of the curated ClusterRole's
                      rules when the grant was activated. A changed rule set suspends the grant.
                    type: string
                  roleUID:
                    description: |-
                      RoleUID is the server-assigned UID of the curated ClusterRole when the
                      grant was activated. A role recreated under the same name is not trusted.
                      Sessions created before this field existed are suspended fail-closed during
                      their next integrity check.
                    type: string
                  targetNamespace:
                    description: TargetNamespace is the profile's fixed namespace.
                    type: string
                required:
                - accessProfile
                - accessProfileUID
                - roleRef
                - targetNamespace
                type: object
              phase:
                description: Phase is the current lifecycle state (Pending, Active,
                  Suspended, Denied, Expired, Revoked)
                enum:
                - Pending
                - Active
                - Suspended
                - Denied
                - Expired
                - Revoked
                type: string
              startTime:
                description: StartTime is when the session became active
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
