# The WebUI ServiceAccount is a read-only facade. Kubernetes RBAC cannot
# filter lists by requester, so the WebUI reads these CRDs and filters them
# strictly by the signed-in person's Kubernetes identity before returning them.
#
# It deliberately has NO write, impersonate, bind, RoleBinding or Secret
# permissions: every request, approval and revocation is sent with the
# person's own OIDC token and authorized, admitted and audited as them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: breakglass-webui-reader
  labels:
    app.kubernetes.io/name: breakglass-webui
    app.kubernetes.io/part-of: breakglass-operator
rules:
  - apiGroups:
      - access.breakglass.io
    resources:
      - accessprofiles
      - breakglassrequests
      - breakglassapprovals
      - breakglasssessions
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: breakglass-webui-reader
  labels:
    app.kubernetes.io/name: breakglass-webui
    app.kubernetes.io/part-of: breakglass-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: breakglass-webui-reader
subjects:
  - kind: ServiceAccount
    name: breakglass-webui
    namespace: breakglass-operator-system
