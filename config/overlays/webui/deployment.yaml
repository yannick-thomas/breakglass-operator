apiVersion: apps/v1
kind: Deployment
metadata:
  name: breakglass-webui
  namespace: breakglass-operator-system
  labels:
    app.kubernetes.io/name: breakglass-webui
    app.kubernetes.io/part-of: breakglass-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: breakglass-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: breakglass-webui
    spec:
      serviceAccountName: breakglass-webui
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webui
          image: breakglass-webui:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: WEBUI_PORT
              value: "8080"
            - name: WEBUI_IN_CLUSTER
              value: "true"
            - name: WEBUI_DEV_MODE
              value: "false"
            - name: WEBUI_OIDC_ENABLED
              value: "false"
            - name: WEBUI_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: breakglass-webui-secret
                  key: cookie-secret
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
