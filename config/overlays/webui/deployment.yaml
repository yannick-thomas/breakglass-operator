apiVersion: apps/v1
kind: Deployment
metadata:
  name: breakglass-webui
  namespace: breakglass-operator-system
  labels:
    app.kubernetes.io/name: breakglass-webui
    app.kubernetes.io/part-of: breakglass-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: breakglass-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: breakglass-webui
    spec:
      serviceAccountName: breakglass-webui
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webui
          image: breakglass-webui:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Sessions live in memory, so the WebUI runs as a single replica.
          # The OIDC client must be trusted by the kube-apiserver with the
          # same issuer and client ID as audience (see docs/WEBUI.md).
          env:
            - name: WEBUI_PORT
              value: "8080"
            - name: WEBUI_IN_CLUSTER
              value: "true"
            - name: WEBUI_PUBLIC_URL
              value: "https://breakglass.example.com"
            - name: WEBUI_OIDC_ISSUER_URL
              value: "https://idp.example.com/realms/platform"
            - name: WEBUI_OIDC_CLIENT_ID
              value: "breakglass-webui"
            - name: WEBUI_OIDC_REDIRECT_URL
              value: "https://breakglass.example.com/auth/callback"
            - name: WEBUI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: breakglass-webui-oidc
                  key: client-secret
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
