# High-assurance production example for a single approved target namespace.
#
# It starts from the HA production overlay, removes the manager's cluster-wide
# RoleBinding CRUD and Namespace get rules, grants RoleBinding CRUD only in
# `production`, and reads only the `production` and `breakglass-access`
# namespaces.
# The manager's cache and admission/controller policy are restricted by the
# matching --allowed-target-namespaces flag below. Access objects are accepted
# only in the control namespace breakglass-access (ADR-004).
resources:
  - ../production
  - manager-rolebindings-production.yaml
  - expiry-guard-rolebindings-production.yaml

patches:
  # The generated manager rules are removed by index: the cluster-wide
  # Namespace get is currently the second rule and the RoleBinding CRUD rule
  # the tenth. If controller-gen changes this ordering, the test guards make
  # rendering fail review rather than silently removing a different
  # permission. The higher index is removed first so the lower stays valid.
  - target:
      kind: ClusterRole
      name: breakglass-operator-manager-role
    patch: |-
      - op: test
        path: /rules/9/apiGroups/0
        value: rbac.authorization.k8s.io
      - op: test
        path: /rules/9/resources/0
        value: rolebindings
      - op: remove
        path: /rules/9
      - op: test
        path: /rules/1/apiGroups/0
        value: ""
      - op: test
        path: /rules/1/resources/0
        value: namespaces
      - op: test
        path: /rules/1/verbs
        value: ["get"]
      - op: remove
        path: /rules/1
      # Read only the target and control namespaces. The target read survives
      # deletion of target-namespace RBAC and distinguishes confirmed absence
      # from a generic cleanup Forbidden; the control-namespace read lets the
      # approval webhook release approvals only while their namespace is being
      # deleted.
      - op: add
        path: /rules/-
        value:
          apiGroups: [""]
          resources: ["namespaces"]
          resourceNames: ["production", "breakglass-access"]
          verbs: ["get"]
  - target:
      kind: Deployment
      labelSelector: control-plane=controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --allowed-target-namespaces=production
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --control-namespaces=breakglass-access
  # The fail-closed control-namespace drain check (ADR-004) matches exactly the
  # control namespace, instead of the opt-in label of the default profile, so
  # it never blocks the deletion of another namespace. Keep the list equal to
  # --control-namespaces.
  - target:
      kind: ValidatingWebhookConfiguration
      name: breakglass-operator-validating-webhook-configuration
    patch: |-
      - op: test
        path: /webhooks/3/name
        value: vcontrolnamespace-v1.kb.io
      - op: replace
        path: /webhooks/3/namespaceSelector
        value:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values: ["breakglass-access"]
  # The expiry guard gets the same namespace restriction as the manager.
  - target:
      kind: ClusterRole
      name: breakglass-operator-expiry-guard-role
    patch: |-
      - op: test
        path: /rules/1/resources/0
        value: rolebindings
      - op: remove
        path: /rules/1
  # The expiry guard may get only the target and control namespaces. This
  # ClusterRole outlives both, so a deleted namespace is confirmed absent
  # (NotFound) and the guard keeps sweeping the others.
  - path: expiry-guard-namespaces-production.yaml
  - target:
      kind: CronJob
      name: breakglass-operator-expiry-guard
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/args/-
        value: --allowed-target-namespaces=production
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/args/-
        value: --control-namespaces=breakglass-access
