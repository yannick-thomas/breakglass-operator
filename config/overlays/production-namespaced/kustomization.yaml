# High-assurance production example for a single approved target namespace.
#
# It starts from the HA production overlay, removes the manager's cluster-wide
# RoleBinding CRUD rule, and grants that capability only in `production`.
# The manager's cache and admission/controller policy are restricted by the
# matching --allowed-target-namespaces flag below.
resources:
  - ../production
  - manager-rolebindings-production.yaml

patches:
  # The RoleBinding policy rule is currently the ninth generated manager rule.
  # If controller-gen changes this ordering, rendering must fail review rather
  # than silently removing a different permission.
  - target:
      kind: ClusterRole
      name: breakglass-operator-manager-role
    patch: |-
      - op: test
        path: /rules/8/apiGroups/0
        value: rbac.authorization.k8s.io
      - op: test
        path: /rules/8/resources/0
        value: rolebindings
      - op: remove
        path: /rules/8
      # Survives deletion of target-namespace RBAC; read only this namespace
      # to distinguish confirmed absence from a generic cleanup Forbidden.
      - op: add
        path: /rules/-
        value:
          apiGroups: [""]
          resources: ["namespaces"]
          resourceNames: ["production"]
          verbs: ["get"]
  - target:
      kind: Deployment
      labelSelector: control-plane=controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --allowed-target-namespaces=production
