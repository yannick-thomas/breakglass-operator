# The manager receives RoleBinding CRUD only in the namespace named by the
# overlay. Keep this resource and --allowed-target-namespaces in sync.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: breakglass-operator-manager-rolebindings
  namespace: production
  labels:
    app.kubernetes.io/name: breakglass-operator
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: breakglass-operator-manager-rolebindings
  namespace: production
  labels:
    app.kubernetes.io/name: breakglass-operator
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: breakglass-operator-manager-rolebindings
subjects:
  - kind: ServiceAccount
    name: breakglass-operator-controller-manager
    namespace: breakglass-operator-system
