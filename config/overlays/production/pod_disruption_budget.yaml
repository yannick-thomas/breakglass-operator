apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  # config/default prefixes the manager name and sets this namespace. Keep this
  # resource explicit so the overlay can safely consume the secure default.
  name: breakglass-operator-controller-manager
  namespace: breakglass-operator-system
  labels:
    app.kubernetes.io/name: breakglass-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  minAvailable: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: breakglass-operator
