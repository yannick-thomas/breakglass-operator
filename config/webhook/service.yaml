apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: breakglass-operator
    app.kubernetes.io/managed-by: kustomize
  name: webhook-service
  namespace: system
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  # Admission calls go to the admission pods only (ADR-005).
  selector:
    app.kubernetes.io/name: breakglass-operator
    app.kubernetes.io/component: admission
