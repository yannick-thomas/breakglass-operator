---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-access-breakglass-io-v1alpha1-breakglassrequest
  failurePolicy: Fail
  name: mbreakglassrequest-v1alpha1.kb.io
  rules:
  - apiGroups:
    - access.breakglass.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - breakglassrequests
  sideEffects: None
  timeoutSeconds: 5
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-access-breakglass-io-v1alpha1-breakglasssession
  failurePolicy: Fail
  name: mbreakglasssession-v1alpha1.kb.io
  rules:
  - apiGroups:
    - access.breakglass.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - breakglasssessions
  sideEffects: None
  timeoutSeconds: 5
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-access-breakglass-io-v1alpha1-breakglassrequest
  failurePolicy: Fail
  name: vbreakglassrequest-v1alpha1.kb.io
  rules:
  - apiGroups:
    - access.breakglass.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - breakglassrequests
  sideEffects: None
  timeoutSeconds: 5
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-access-breakglass-io-v1alpha1-breakglasssession
  failurePolicy: Fail
  name: vbreakglasssession-v1alpha1.kb.io
  rules:
  - apiGroups:
    - access.breakglass.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - breakglasssessions
  sideEffects: None
  timeoutSeconds: 5
