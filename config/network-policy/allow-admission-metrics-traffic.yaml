# Allow metrics scraping of the admission pods (ADR-005) from namespaces
# labelled 'metrics: enabled', like the manager's metrics policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: breakglass-operator
    app.kubernetes.io/component: admission
    app.kubernetes.io/managed-by: kustomize
  name: allow-admission-metrics-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: breakglass-operator
      app.kubernetes.io/component: admission
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            metrics: enabled  # Only from namespaces with this label
      ports:
        - port: 8443
          protocol: TCP
