version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
        # Clean architecture (docs/adr-002-clean-architecture.md): the domain
        # depends on the standard library only, use cases on the domain and
        # their own ports. test/architecture checks the transitive closure.
        domain-is-pure:
          list-mode: strict
          files:
            - "**/internal/domain/**"
          allow:
            - $gostd
            - github.com/yannick-thomas/breakglass-operator/internal/domain
        usecases-depend-inward:
          list-mode: strict
          files:
            - "**/internal/usecase/**"
          allow:
            - $gostd
            - github.com/go-logr/logr
            - github.com/yannick-thomas/breakglass-operator/internal/domain
            - github.com/yannick-thomas/breakglass-operator/internal/usecase
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - goconst
        path: _test\.go$
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
